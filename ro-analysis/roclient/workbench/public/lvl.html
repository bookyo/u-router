<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>老号练级中心 · 工作台</title>
<style>
:root{--bg:#111;--panel:#1b1b1f;--line:#2a2a30;--fg:#ddd;--dim:#888;--acc:#6cf;--ok:#6f6;--warn:#f96}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:13px/1.6 Menlo,monospace;margin:0;padding:14px}
h2{margin:0 0 4px;font-size:15px}h3{margin:10px 0 6px;font-size:13px;color:var(--acc)}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:400}
.tag{padding:0 6px;border-radius:3px;font-size:11px}
.s-pending{background:#222;color:var(--dim)}.s-running{background:rgba(255,200,60,.15);color:#fc6}
.s-done{background:rgba(60,200,90,.15);color:var(--ok)}.s-error{background:rgba(255,90,90,.15);color:var(--warn)}
textarea,input,button{background:#151518;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:6px 8px;font:12px Menlo,monospace}
textarea{width:100%;height:90px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.pri{background:#1d3a52;border-color:#2d5a82}button.mini{padding:1px 7px;font-size:11px}
.logbox{background:#0d0d10;border:1px solid var(--line);border-radius:4px;padding:6px;max-height:180px;overflow:auto;font-size:11px;white-space:pre-wrap}
.dim{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>🎓 老号练级中心 <span class="dim">（批量输入账号密码，3 并发练到全角色 30 级，同练级标签逻辑）</span></h2>
    <div class="dim" style="margin-bottom:6px"><a href="/">← 返回工作台</a> ｜ 自动跳过已 30 级角色 ｜ 与赏金/AFK 账号互斥（练级优先级最低，被占用自动等待）
    <h3>批量添加（每行一个：账号:密码）</h3>
    <textarea id="bulk" placeholder="account:password&#10;account2:password2"></textarea>
    <div style="margin-top:6px">
      <button class="pri" onclick="addBulk()">➕ 添加并启动</button>
      <button onclick="lvlStart()" id="btnStart">▶ 启动</button>
      <button onclick="lvlStop()">⏹ 全部停止</button>
      <span class="dim" id="hint"></span>
    </div>
  </div>
  <div class="card">
    <h3>账号列表 <span class="dim" id="stat"></span></h3>
    <table id="tbl"><thead><tr><th>账号</th><th>状态</th><th>备注</th><th>更新时间</th><th>操作</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
async function api(p, opt) {
  // opt.body 对象必须序列化（旧 Object.assign 覆盖 bug）；无 body 的调用默认 GET，带 body/start/stop 类默认 POST
  const o = opt || {};
  const method = o.method || (o.body != null ? 'POST' : 'GET');
  const r = await fetch(p, method === 'GET'
    ? { method }
    : { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o.body || {}) });
  if (!r.ok) throw new Error(await r.text().catch(() => r.statusText));
  return r.json();
}
async function refresh() {
  const d = await api('/api/lvl');
  const done = d.accounts.filter(a => a.status === 'done').length;
  document.getElementById('stat').textContent = `（${done}/${d.accounts.length} 完成 ｜ 并发 ${d.running.length}/${d.max}${d.active ? ' 运行中' : ' 已停止'}）`;
  document.getElementById('tbl').querySelector('tbody').innerHTML = d.accounts.map((a) => {
    const cls = 's-' + a.status;
    const t = a.updated_at ? new Date(a.updated_at).toLocaleString('zh-CN', { hour12: false }) : '-';
    return `<tr><td><b>${a.account}</b><div class="logbox" id="lg${a.id}">${(d.logs[a.account] || []).slice(-12).join('\n')}</div></td>
    <td><span class="tag ${cls}">${a.status}</span></td><td>${a.note || ''}</td><td>${t}</td>
    <td><button class="mini" onclick="requeue(${a.id}, '${a.status}')">重入</button> <button class="mini" onclick="del(${a.id})">删</button></td></tr>`;
  }).join('');
  d.accounts.forEach((a) => { const el = document.getElementById('lg' + a.id); if (el) el.scrollTop = el.scrollHeight; });
}
async function addBulk() {
  const text = document.getElementById('bulk').value.trim();
  if (!text) return alert('填入账号:密码 每行一个');
  const r = await api('/api/lvl', { body: { text } });
  if (!r.added) { alert('一行也没解析出来！格式：账号:密码（冒号/空格分隔），检查后重试'); return; }
  document.getElementById('hint').textContent = `已添加 ${r.added} 个账号并启动` + (r.skipped && r.skipped.length ? `；跳过 ${r.skipped.length} 行无法解析: ${r.skipped.join(' | ')}` : '');
  document.getElementById('bulk').value = '';
}
async function lvlStart() { await api('/api/lvl/start', { method: 'POST' }); refresh(); }
async function lvlStop() { await api('/api/lvl/stop', { method: 'POST' }); refresh(); }
async function requeue(id, status) {
  if (status === 'running' && !confirm('该账号正在运行，重新入队会先终止当前 worker（进度已保存）。继续？')) return;
  await api(`/api/lvl/${id}/requeue`, { method: 'POST' });
  refresh();
}
async function del(id) { if (!confirm('删除该账号？')) return; await api(`/api/lvl/${id}`, { method: 'DELETE' }); refresh(); }
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
