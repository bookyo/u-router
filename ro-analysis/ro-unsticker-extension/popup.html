<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.6 system-ui, sans-serif; width: 300px; margin: 10px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 0 0 8px; }
  legend { font-size: 12px; color: #555; }
  label { display: block; cursor: pointer; }
  .row { margin: 6px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 12px; }
  .grid label { display: flex; justify-content: space-between; align-items: center; }
  .grid input { width: 70px; }
  input[type=text], input[type=number] { padding: 2px 4px; }
  button { width: 100%; padding: 6px; margin: 3px 0; cursor: pointer; }
  #status { font-size: 12px; color: #060; min-height: 18px; white-space: pre-wrap; }
  #floorState { font-size: 12px; margin-left: 6px; font-weight: 600; }
  .warn { color: #a60; }
</style>
</head>
<body>
  <h1>RO 启动器解卡器</h1>
  <fieldset>
    <legend>线路（ClientVer）</legend>
    <label><input type="radio" name="cv" value="5" checked> 5 · V6-Eden N 进阶二转（26569）</label>
    <label><input type="radio" name="cv" value="3"> 3 · V6-Online 三转（28569）</label>
    <label><input type="radio" name="cv" value="4"> 4 · 电信线路（29569）</label>
  </fieldset>
  <div class="row">
    <button id="reload">保存默认 + 重载当前标签（推荐）</button>
    <button id="inject">仅注入当前标签（不重载）</button>
  </div>
  <div class="row">
    <button id="export">⬇ 导出当前封包（JSON）</button>
  </div>
  <div id="status">读取标签状态…</div>

  <fieldset>
    <legend>自动地板（巫师）</legend>
    <div class="grid">
      <label>瞬移键 <input type="text" id="f1" value="F1"></label>
      <label>群法键 <input type="text" id="f2" value="F2"></label>
      <label>瞬移后延迟 <input type="number" id="tpDelay" value="500">ms</label>
      <label>施法等待 <input type="number" id="castTime" value="2000">ms</label>
      <label>X偏移 <input type="number" id="dx" value="0">px</label>
      <label>Y偏移 <input type="number" id="dy" value="32">px</label>
      <label>启停热键 <input type="text" id="toggleKey" value="Alt+Z"></label>
      <label>按键→点击 <input type="number" id="keyGap" value="120">ms</label>
    </div>
    <div class="row">
      <button id="floorSave">应用设置</button>
      <button id="floorToggle">开始 / 停止 (循环瞬移+地板)</button>
      <div>状态: <span id="floorState">-</span></div>
    </div>
    <div style="font-size:11px;color:#777">流程: 瞬移键 → 延迟 → 群法键 → 点击屏幕中心+偏移（人物下方一格）→ 施法等待 → 循环。掉线自动停止。</div>
  </fieldset>
  <script src="popup.js"></script>
</body>
</html>
