<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>词条随行</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark">词</span>
        <div><strong>词条随行</strong><small>TERM POCKET</small></div>
      </div>
      <div class="tools">
        <button
          id="settings"
          class="icon"
          title="API 设置"
          aria-label="API 设置"
        >
          ⚙</button
        ><button id="close" class="icon" aria-label="关闭面板">×</button>
      </div>
    </header>
    <nav aria-label="功能">
      <button id="search-tab" class="active" aria-pressed="true">
        搜索词条</button
      ><button id="add-tab" aria-pressed="false">添加词条</button>
    </nav>
    <main>
      <section id="search-section">
        <p class="intro">找到一个词，连接更多语言。</p>
        <form id="search-form">
          <label for="query">词语 / 译名</label>
          <div class="search-line">
            <input
              id="query"
              placeholder="Example 或 示例"
              maxlength="256"
              required
              autofocus
            /><button class="primary" type="submit">搜索</button>
          </div>
          <label for="source">输入语言</label
          ><input
            id="source"
            list="languages"
            value="en"
            required
            placeholder="语言代码，如 en"
          /><small class="hint">按完整词语匹配，支持同义词和译名。</small>
        </form>
        <div id="results" aria-live="polite"></div>
        <button id="more-results" class="secondary" hidden>加载更多</button>
      </section>
      <section id="add-section" hidden>
        <p class="intro" id="form-intro">让同一个意思，拥有不同语言的名字。</p>
        <form id="add-form">
          <div id="language-rows"></div>
          <button id="add-language" type="button" class="secondary">
            ＋ 添加更多语言
          </button>
          <p class="hint" id="form-hint">
            每行一个译名，可填写多个同义词。英文与简体中文必填；相同内容再次提交也会创建新词条。
          </p>
          <button id="create" class="primary full" type="submit">
            创建多语言词条
          </button>
          <button id="cancel-edit" type="button" class="secondary" hidden>
            取消编辑
          </button>
        </form>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <footer id="connection">正在读取设置…</footer>
    <datalist id="languages">
      <option value="en">English</option>
      <option value="zh-Hans">简体中文</option>
      <option value="zh-Hant">繁體中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ar">العربية</option>
    </datalist>
    <script type="module" src="panel.js"></script>
  </body>
</html>
